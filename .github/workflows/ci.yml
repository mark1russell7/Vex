name: CI

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The source and the tests of each package (tsconfig.json and tsconfig.test.json)
      - run: pnpm typecheck
      # Oxlint with type-aware rules
      - run: pnpm lint
      - run: pnpm test
      # The coverage of @vex/core from the tests of each package, with the thresholds of vitest.config.ts
      - run: pnpm test:coverage
      # The code blocks of the docs with the meta word "doctest": types, values and type errors
      - run: pnpm test:docs
      # The writing rules (ASD-STE100) of the README files, the docs and the doc comments
      - run: pnpm lint:ste

  # The site: typecheck of the widgets, the spec pages and the static build
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vex/site run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
      # The smoke tests: each route renders without a console error, and the main widgets work
      - run: pnpm --filter @vex/site exec playwright install --with-deps chromium
      - run: pnpm --filter @vex/site run test:e2e
        env:
          ASTRO_TELEMETRY_DISABLED: "1"

  # The packages as npm gives them: the build, publint and attw on each tarball, and a program in an empty project
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:packages

  # The only check that a pull request must pass
  ci-ok:
    name: CI OK
    if: always()
    needs: [check, site, package]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: All jobs passed
        run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
