name: Release

# Changesets: this workflow opens a pull request with the new versions and change logs. After a merge of that
# pull request, the next start publishes the packages to npm with provenance.
#
# The owner starts it by hand. Before the first release, the owner does these steps (docs/REVIEW.md §9.1, D8):
# 1. Set the package names and remove "private": true from @mark1russell7/vex, @mark1russell7/vex-domains and @mark1russell7/vex-testkit.
# 2. On npmjs.com, add this repository and this workflow as the trusted publisher of each package, with direct
#    publishing (Changesets cannot stage a release at this time).
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # The version pull request: a branch and a pull request
      contents: write
      pull-requests: write
      # npm trusted publishing (OIDC) and provenance
      id-token: write
    steps:
      # The Changesets action pushes the version branch, so the checkout keeps its credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:packages
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm exec changeset version
          publish: pnpm exec changeset publish
          title: Version the packages
          commit: Version the packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
